<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigma Rule Assistant</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>🛡️ Sigma Assistant</h2>
                <button id="new-chat-btn" title="New Chat">+</button>
            </div>
            <div id="session-list" class="session-list">
                <!-- Sessions go here -->
            </div>
            <div class="context-panel">
                <h3>Knowledge Context</h3>
                <p class="empty-state">Context from MITRE & Sysmon will appear here...</p>
                <div id="context-content"></div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-area">
            <div class="chat-header">
                <h1>Detection Engineering Workspace</h1>
            </div>

            <div id="chat-history" class="chat-history">
                <div class="message assistant">
                    <div class="avatar">AI</div>
                    <div class="content">
                        Hello! I am your Sigma Rule Assistant. Describe an attack technique, and I will help you create
                        a detection rule for it correctly mapped to MITRE ATT&CK and Sysmon.
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div id="file-preview" class="file-preview" style="display: none;">
                    <span id="file-name"></span>
                    <button id="remove-file">×</button>
                </div>
                <input type="file" id="file-input" style="display: none;">
                <button id="attach-btn" title="Attach Image/Log">📎</button>
                <textarea id="user-input"
                    placeholder="Describe the attack (e.g., 'Attackers are dumping lsass.exe using procdump')..."
                    rows="3"></textarea>
                <button id="send-btn">Generate Rule 🚀</button>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
